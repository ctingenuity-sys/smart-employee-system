<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1e293b" />
    <title>نظام الموظفين الذكي</title>
    
    <!-- Immediate Theme Initialization to prevent flash and preserve theme on reload -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('app_theme') || localStorage.getItem('theme');
          if (!saved) {
            var match = document.cookie.match(/(?:^|;\s*)app_theme=(dark|light)/);
            if (match) saved = match[1];
          }
          var theme = (saved === 'light' || saved === 'dark') ? saved : 'dark';
          var root = document.documentElement;
          if (theme === 'dark') {
            root.classList.add('dark');
            root.setAttribute('data-theme', 'dark');
            root.style.colorScheme = 'dark';
          } else {
            root.classList.remove('dark');
            root.setAttribute('data-theme', 'light');
            root.style.colorScheme = 'light';
          }
        } catch (e) {}
      })();
    </script>
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" type="image/png" href="/app-icon-3d.png">
    <link rel="apple-touch-icon" href="/app-icon-3d.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="نظام الموظفين">
    <meta name="mobile-web-app-capable" content="yes">
    
    <!-- PWA Auto-Update Script for Chunk Errors -->
    <script>
      window.addEventListener('error', function(e) {
        if (e.target && e.target.tagName === 'SCRIPT') {
          const src = e.target.src || '';
          if (src.includes('/assets/')) {
            console.error('Failed to load script chunk. Unregistering service worker and reloading...');
            if ('serviceWorker' in navigator) {
              navigator.serviceWorker.getRegistrations().then(function(registrations) {
                for(let registration of registrations) {
                  registration.unregister();
                }
                setTimeout(function() { window.location.reload(); }, 500);
              });
            } else {
              setTimeout(function() { window.location.reload(); }, 500);
            }
          }
        }
      }, true);
    </script>

    <!-- Suppress Tailwind Production Warning -->
    <script>
      (function() {
        var originalWarn = console.warn;
        console.warn = function(...args) {
          if (args.length > 0) {
            const msg = args.join(' ');
            if (typeof msg === 'string' && (msg.includes('cdn.tailwindcss.com') || msg.includes('production'))) {
              return;
            }
          }
          originalWarn.apply(console, args);
        };
      })();
    </script>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- CHANGED FONT TO CAIRO -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@200..1000&family=Oswald:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js" defer></script>
    <!-- ADDED TESSERACT.JS FOR CLIENT-SIDE OCR -->

    <!-- ADDED HTML5-QRCODE FOR CERTIFICATE SCANNING -->

    <script>
      tailwind.config = {

          extend: {

        }

    </script>
    <style>
      body {
        background-color: #f1f5f9;
        font-family: 'Cairo', sans-serif; /* Updated to Cairo */
      }
      html.dark body {
        background-color: #0f172a;
        color: #f8fafc;
      }
      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #f1f5f9; 
      }
      ::-webkit-scrollbar-thumb {
        background: #cbd5e1; 
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #94a3b8; 
      }
      html.dark ::-webkit-scrollbar-track {
        background: #0f172a;
      }
      html.dark ::-webkit-scrollbar-thumb {
        background: #334155;
      }
      html.dark ::-webkit-scrollbar-thumb:hover {
        background: #475569;
      }

      /* Unified Executive Slate Theme across system pages */
      html.dark .bg-white {
        background-color: #1e293b !important;
        color: #f1f5f9;
      }
      html.dark .bg-slate-50,
      html.dark .bg-slate-100,
      html.dark .bg-gray-50,
      html.dark .bg-gray-100 {
        background-color: #0f172a !important;
        color: #f1f5f9;
      }
      html.dark .bg-slate-200,
      html.dark .bg-gray-200 {
        background-color: #334155 !important;
        color: #f8fafc;
      }
      html.dark .border-slate-100,
      html.dark .border-slate-200,
      html.dark .border-slate-300,
      html.dark .border-gray-100,
      html.dark .border-gray-200,
      html.dark .border-gray-300 {
        border-color: #334155 !important;
      }
      html.dark .text-slate-800,
      html.dark .text-slate-900,
      html.dark .text-gray-800,
      html.dark .text-gray-900,
      html.dark .text-slate-700,
      html.dark .text-gray-700 {
        color: #f8fafc !important;
      }
      html.dark .text-slate-600,
      html.dark .text-gray-600 {
        color: #cbd5e1 !important;
      }
      html.dark .text-slate-500,
      html.dark .text-gray-500 {
        color: #94a3b8 !important;
      }
      html.dark input:not([type="checkbox"]):not([type="radio"]):not([type="submit"]):not([type="button"]),
      html.dark select,
      html.dark textarea {
        background-color: #1e293b !important;
        border-color: #334155 !important;
        color: #f8fafc !important;
      }
      html.dark table thead th {
        background-color: #0f172a !important;
        color: #cbd5e1 !important;
        border-color: #334155 !important;
      }
      html.dark table tbody tr {
        border-color: #334155 !important;
      }
      html.dark table tbody tr:hover {
        background-color: rgba(51, 65, 85, 0.4) !important;
      }
      html.dark .divide-slate-200,
      html.dark .divide-gray-200 {
        border-color: #334155 !important;
      }
      
      @media print {
        @page {
          size: landscape;
          margin: 0.5cm;
        }
        body {
          -webkit-print-color-adjust: exact !important;
          print-color-adjust: exact !important;
          background-color: white !important;
          margin: 0 !important;
          padding: 0 !important;
          font-family: 'Cairo', sans-serif !important; /* Updated to Cairo */
          font-size: 11px;
        }
        
        .no-print, button, input, select, .print\:hidden, nav, header, .sidebar, .toast {
          display: none !important;
        }

        .min-h-screen {
          min-height: 0 !important;
          height: auto !important;
          padding: 0 !important;
        }
        
        h1, h2, h3, h4, h5, h6 {
          color: #000 !important;
        }
        
        table {
          width: 100% !important;
          border-collapse: collapse !important;
          page-break-inside: auto;
        }
        tr {
          page-break-inside: avoid;
          page-break-after: auto;
        }
        thead {
          display: table-header-group;
        }
        tfoot {
          display: table-footer-group;
        }
        
        * {
           box-shadow: none !important; 
           text-shadow: none !important;
        }
        
        .print\:block { display: block !important; }
        .print\:hidden { display: none !important; }
      }
    </style>

<link rel="stylesheet" href="/index.css">
